title: Miles Chatterji - Personal Website & Photography Portfolio
description: Personal website and photography portfolio showcasing creative work and professional experience
author: Miles Chatterji
email: miles.chatterji@gmail.com
url: "https://mileschatterji.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

# Collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "portfolio-item"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# GitHub Pages settings
github: [MilesChatterji]  # Replace with your GitHub username
repository: MilesChatterji/Prod-GHPages-mileschatterji.com-1  # Replace with your repository name

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Navigation structure
navigation:
  - title: Biography
    submenu:
      - title: Professional History
        url: /biography/experience/
      - title: Creative History
        url: /biography/creative/
  - title: Portfolio
    submenu:
      - title: Photography
        url: /portfolio/gallery/
      - title: Podcast
        url: /portfolio/audio/
      - title: Videography
        url: /portfolio/videography/
      - title: Writings
        url: /portfolio/writing/
  - title: Contact
    url: /contact/
#    submenu:
#      - title: Get in Touch
#       url: /contact/contact-form/
#     - title: Social Media
#        url: /contact/social/
#     - title: Location
#       url: /contact/location/
